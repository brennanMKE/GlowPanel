<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glow Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bar">
        <h1>Glow Panel</h1>
        <div class="bar-right">
            <!-- On/Off used to be a pair of big buttons taking a whole panel at
                 the bottom of the page, where a short window cut them off. It is
                 one switch up here instead: rarely the thing you came for, and
                 always visible. -->
            <button type="button" id="power" class="toggle" role="switch" aria-checked="false">
                <span class="track"><span class="knob"></span></span>
                <span class="tlabel" id="powerLabel">Off</span>
            </button>
            <div class="conn" id="conn"><span class="dot" id="dot"></span><span id="connText">connecting…</span></div>
            <button type="button" id="aboutBtn" class="info" aria-label="About Glow Panel">i</button>
        </div>
    </header>

    <!-- Which build is this? The Fyne port draws the same controls, and the two
         were mistaken for each other more than once while it was evaluated. -->
    <div id="aboutBack" class="modal-back" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
            <h2 id="aboutTitle">About</h2>
            <dl id="aboutRows" class="about-rows"></dl>
            <button type="button" id="aboutClose" class="modal-close">Close</button>
        </div>
    </div>

    <div id="error" class="error" hidden></div>

    <!-- Themes first: they are what anyone walking up to the panel actually
         wants, and pressing one also turns the strips on.

         Effects share this panel rather than living on a second screen: the
         brightness slider and the power switch stay reachable whichever grid is
         showing, and there is no navigation for a child to get lost in. -->
    <main>
        <section class="panel">
            <div class="panel-head picker-head">
                <h2 id="pickerTitle">Pick a Look</h2>
                <div class="seg" role="tablist" aria-label="Looks, effects or custom">
                    <button type="button" class="seg-btn on" id="tabLooks"
                            role="tab" aria-selected="true">Looks</button>
                    <button type="button" class="seg-btn" id="tabEffects"
                            role="tab" aria-selected="false">Effects</button>
                    <button type="button" class="seg-btn" id="tabCustom"
                            role="tab" aria-selected="false">Custom</button>
                </div>
            </div>

            <div class="themes" id="themes"></div>
            <div class="themes effects" id="effects" hidden></div>

            <!-- The builder. Nine modes, one to eight colours, and the two
                 sliders — laid out as labelled rows rather than stacked
                 sections, which is what lets the whole thing fit without the
                 middle of the page starting to scroll. -->
            <div class="builder" id="builder" hidden>
                <div class="brow">
                    <span class="blabel">Mode</span>
                    <div class="modes" id="modes"></div>
                </div>

                <!-- Why a mode is unavailable, rather than a button that just
                     refuses to work. Only ever about the three modes that
                     discard saturation. -->
                <p class="bnote" id="modeNote" hidden></p>

                <div class="brow">
                    <span class="blabel">Colours</span>
                    <div class="swatches" id="swatches"></div>
                    <span class="count" id="swatchCount">1/8</span>
                    <div class="sw-controls">
                        <button type="button" id="swLeft" aria-label="Move colour earlier">◀</button>
                        <button type="button" id="swRight" aria-label="Move colour later">▶</button>
                        <button type="button" id="swRemove" aria-label="Remove colour">✕</button>
                        <button type="button" id="swAdd" aria-label="Add colour">+</button>
                    </div>
                </div>

                <div class="brow">
                    <span class="blabel">Palette</span>
                    <div class="palette" id="palette"></div>
                </div>

                <div class="brow">
                    <span class="blabel">Preview</span>
                    <div class="preview" id="preview"></div>
                    <span class="approx">approximate — the strip runs warmer and dimmer</span>
                </div>

                <div class="brow sliders">
                    <label class="blabel" for="speed">Speed</label>
                    <input type="range" id="speed" min="0" max="255" step="5" value="128">
                    <label class="blabel" for="intensity" id="intensityLabel">Intensity</label>
                    <input type="range" id="intensity" min="0" max="255" step="5" value="180">
                </div>

                <p class="bnote" id="meansNote" hidden></p>
            </div>

            <!-- Shown on the Effects tab, and also on the Looks tab whenever
                 something is running, so the Stop button is never more than one
                 press away from wherever the user happens to be. -->
            <div class="effect-bar" id="effectBar" hidden>
                <div class="dur" id="durations" role="group" aria-label="How long to run">
                    <span class="dur-label">Run for</span>
                </div>
                <div class="running" id="running" hidden>
                    <span class="pip"></span><span id="runningText"></span>
                </div>
                <button type="button" class="apply" id="apply" hidden>Apply</button>
                <button type="button" class="stop" id="stop">Stop</button>
            </div>
        </section>

        <section class="panel brightness-panel">
            <div class="panel-head">
                <h2>Brightness</h2>
                <output id="pct" class="pct">—</output>
            </div>

            <div class="slider-row">
                <button class="step" id="down" aria-label="Dimmer">−</button>
                <input type="range" id="bright" min="0" max="100" step="5" value="50"
                       aria-label="Brightness percent">
                <button class="step" id="up" aria-label="Brighter">+</button>
            </div>

            <div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
        </section>
    </main>

    <footer>
        <div class="chips" id="chips"></div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
